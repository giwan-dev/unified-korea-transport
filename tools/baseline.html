<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>기준 연도 계산</title>
  <style>body { font: 14px system-ui, sans-serif; margin: 24px; } pre { background: #f4f4f4; padding: 12px; }</style>
</head>
<body>
  <h1>기준 연도 사전 계산</h1>
  <p>데이터를 다시 만든 뒤 <code>python tools/serve.py</code>로 띄우고 이 페이지를 열면,
    기준 연도 보정·배정 결과를 <code>data/baseline.json</code>, <code>data/baseline.bin</code>으로 저장합니다.</p>
  <pre id="log"></pre>
  <script type="module">
    import { effectiveNetwork, newGame, initAirRoutes } from '../js/game/state.js';
    import { seedServices } from '../js/game/services.js';
    import { seedInterKoreaAir } from '../js/game/airlines.js';
    import { loadNetwork } from '../js/data/netpack.js';
    import { fixNetwork, LEN_FIX_V } from '../js/data/netfix.js';
    import { extendWorld, urbanLanes } from '../js/game/world.js';
    const log = (s) => { document.querySelector('#log').textContent += s + '\n'; };
    const [zones, net, meta, grid] = await Promise.all([
      fetch('../data/zones.json').then((r) => r.json()),
      loadNetwork('../data/'),
      fetch('../data/meta.json').then((r) => r.json()),
      fetch('../data/grid.bin').then((r) => r.arrayBuffer()),
    ]);
    // 게임(main.js)과 같은 자료 손질: 노드 자리·분기점·구간 고치기. 구간 고치기 판은 자료 판(stamp)에 붙인다
    const jsonOr = (u) => fetch(u).then((r) => (r.ok ? r.json() : {})).catch(() => ({}));
    const linkFix = await jsonOr('../data/link_fix.json');
    log(`자료 손질 ${JSON.stringify(fixNetwork(net, await jsonOr('../data/node_fix.json'), await jsonOr('../data/road_geom_fix.json'), linkFix))}`);
    if (linkFix.v) meta.stamp = `${meta.stamp}+f${linkFix.v}`;
    meta.stamp = `${meta.stamp}+L${LEN_FIX_V}`;   // 계산 길이를 도형 길이로 맞춘 판 (게임과 같게)
    const world = await fetch('../data/air_sea.json').then((r) => r.json());
    extendWorld(net, zones, world);
    log(`도심 간선도로 차로 보정 ${urbanLanes(net, grid)}개 구간`);
    const state = newGame('normal');
    initAirRoutes(state, world.routes || []);
    seedInterKoreaAir(state);
    seedServices(state, net);
    // 관광지 → 존 (main.js의 assignTourism과 같은 규칙)
    const tour = await fetch('../data/tourism.json').then((r) => r.json());
    for (const s of tour.sites) {
      let best = -1, bd = Infinity;
      zones.forEach((z, i) => { if (!z.ext) for (const [x, y] of z.subs) { const d = (x - s.lon) ** 2 + (y - s.lat) ** 2; if (d < bd) { bd = d; best = i; } } });
      const daily = (s.visitors * 1e6) / 365;
      if (s.kp) zones[best].tourKP = (zones[best].tourKP || 0) + daily; else zones[best].tour = (zones[best].tour || 0) + daily;
      let k = 0, bd2 = Infinity;
      zones[best].subs.forEach(([x, y], n) => { const d = (x - s.lon) ** 2 + (y - s.lat) ** 2; if (d < bd2) { bd2 = d; k = n; } });
      (zones[best][s.kp ? 'tourSubsKP' : 'tourSubs'] ||= []).push([k, daily]);
    }
    for (const [name, v] of Object.entries(tour.foreign || {})) {
      const z = zones.find((x) => x.ext && x.name === name);
      if (z) z.tour = (z.tour || 0) + (v * 1e6) / 365;
    }
    const t0 = performance.now();
    const worker = new Worker(new URL('../js/sim/worker.js', import.meta.url), { type: 'module' });
    worker.onmessage = async (ev) => {
      const m = ev.data;
      if (m.type === 'progress') { document.title = `${m.label} ${Math.round(m.value * 100)}%`; return; }
      if (m.type === 'error') { log('오류: ' + m.message); return; }
      if (m.type !== 'baseline') return;
      log(`계산 ${((performance.now() - t0) / 1000).toFixed(1)}초`);
      const a = await fetch('../data/baseline.json', { method: 'PUT', body: JSON.stringify(m.json) });
      const b = await fetch('../data/baseline.bin', { method: 'PUT', body: m.bin });
      log(`저장 ${a.status} ${b.status} · 링크 ${m.json.sizes.L} · 데이터 ${meta.stamp}`);
      document.title = '완료';
    };
    log('계산 중…');
    worker.postMessage({
      type: 'baseline', zones, grid,
      net: effectiveNetwork(net, state), ctx: { integration: state.integration, policy: state.policy }, meta,
    });
  </script>
</body>
</html>
