<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" role="img" aria-label="JR (게임 표시)">
  <!-- 게임 안의 일본 철도(JR) 표시: 실제 회사 로고가 아니다. 초록 바탕에 신칸센 앞모습을 단순화한 엠블럼 -->
  <rect x="0" y="0" width="160" height="48" rx="8" fill="#1E7B4A"/>
  <g transform="translate(24 24)">
    <circle r="17" fill="#26975C" stroke="#E8F6EE" stroke-width="2"/>
    <path d="M-12 6 C -10 -6, 10 -6, 12 6 Z" fill="#fff"/>
    <path d="M-7 1 H7" stroke="#1E5AA8" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <text x="50" y="23" font-family="'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" font-weight="800" fill="#fff" letter-spacing=".5">JR</text>
  <text x="50" y="38" font-family="'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="600" fill="#E8F6EE">일본 철도 (게임 표시)</text>
</svg>
