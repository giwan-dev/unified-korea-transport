  <g transform="translate(24 24)">
    <circle r="17" fill="#A32626" stroke="#ECECEC" stroke-width="2"/>
    <path d="M-9 12 L-5 -11 M9 12 L5 -11" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
