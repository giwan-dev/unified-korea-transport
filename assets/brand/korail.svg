<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" role="img" aria-label="코레일 (게임 표시)">
  <!-- 게임 안의 코레일 표시: 실제 회사 로고를 쓰지 않고, 같은 체계(원형 엠블럼 + 이름)로 그린 남측 철도 배지 -->
  <rect x="0" y="0" width="160" height="48" rx="8" fill="#163E7A"/>
  <g transform="translate(24 24)">
    <circle r="17" fill="#1F5FBF" stroke="#9CC3F5" stroke-width="2"/>
    <path d="M-12 6 C -4 6, 4 -6, 12 -6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <path d="M-12 11 C -4 11, 4 -1, 12 -1" fill="none" stroke="#9CC3F5" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="50" y="23" font-family="'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" font-weight="800" fill="#fff" letter-spacing=".5">KORAIL</text>
  <text x="50" y="38" font-family="'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="600" fill="#9CC3F5">남측 철도 (게임 표시)</text>
</svg>
